# NES linker configuration for CC65
# Super Mario Bros. - NROM-128 (mapper 0)

# Memory layout for NES
MEMORY {
    # Zero page (0x0000-0x00FF) - 256 bytes
    ZP:         start = $0000, size = $0100, type = rw;
    
    # RAM (0x0100-0x07FF) - 2KB
    RAM:        start = $0100, size = $0700, type = rw;
    
    # Sprite RAM/OAM (0x0200-0x02FF) - 256 bytes
    SPRRAM:     start = $0200, size = $0100, type = rw;
    
    # PPU registers (0x2000-0x2007)
    PPUREGS:    start = $2000, size = $0008, type = rw;
    
    # APU registers (0x4000-0x4017)
    APUREGS:    start = $4000, size = $0018, type = rw;
    
    # Cartridge RAM (if any)
    CARTRAM:    start = $6000, size = $2000, type = rw;
    
    # PRG ROM bank 0 (0x8000-0xBFFF) - 16KB
    PRG0:       start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    
    # PRG ROM bank 1 (0xC000-0xFFFF) - 16KB (fixed)
    PRG1:       start = $C000, size = $4000, type = ro, fill = yes, fillval = $FF;
}

# SEGMENTS
SEGMENTS {
    # Zero page variables
    ZEROPAGE:   load = ZP, type = bss;
    
    # BSS (uninitialized data)
    BSS:        load = RAM, type = bss;
    
    # Sprite RAM
    OAM:        load = SPRRAM, type = bss;
    
    # Initialized data
    DATA:       load = RAM, type = rw;
    
    # Code
    CODE:       load = PRG0, type = ro;
    
    # Startup code (crt0)
    STARTUP:    load = PRG0, type = ro;
    
    # Fixed code (interrupts, etc.)
    FIXED:      load = PRG1, type = ro;
    
    # CHR ROM (graphics) - if present
    CHARS:      start = $0000, size = $2000, type = ro;
}

# FEATURES
FEATURES {
    CONDES: type = constructor, segment = FIXED;
}

# SYMBOLS
SYMBOLS {
    __STACKSIZE:     value = $0100;    # 256 byte stack
    __RESET_VECTOR:  value = $8000;    # Reset vector
    __NMI_VECTOR:    value = $8000;    # NMI handler (placeholder)
    __IRQ_VECTOR:    value = $8000;    # IRQ handler (placeholder)
}
